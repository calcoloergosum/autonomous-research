[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arf"
version = "0.1.0"
description = "VS-001 fixed local research-task lifecycle"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["arf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
arf = ["observer_schema.json", "observer_assets/index.html", "observer_assets/licenses.txt", "observer_assets/assets/*"]
